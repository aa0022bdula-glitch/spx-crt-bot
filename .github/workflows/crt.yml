name: SPX500 CRT Scanner
on:
  schedule:
    - cron: "*/30 * * * *
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scanner.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ALPHA_KEY: ${{ secrets.ALPHA_KEY }}
